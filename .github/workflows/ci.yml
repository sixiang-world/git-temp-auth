name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify exe exists
        run: |
          ls -lh dist/gh-app-token.exe
          file dist/gh-app-token.exe

      - name: Self-check (--help)
        run: dist/gh-app-token.exe --help || true

      - name: Self-check (--version)
        run: dist/gh-app-token.exe --version
