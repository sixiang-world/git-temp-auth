name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: gh-app-token-linux
          - os: macos-latest
            artifact: gh-app-token-macos
          - os: windows-latest
            artifact: gh-app-token-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

      - name: Verify binary
        shell: bash
        run: |
          ls -lh dist/gh-app-token.exe
          file dist/gh-app-token.exe || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/gh-app-token.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          mv artifacts/gh-app-token-linux/gh-app-token.exe release/gh-app-token-linux
          mv artifacts/gh-app-token-macos/gh-app-token.exe release/gh-app-token-macos
          mv artifacts/gh-app-token-windows/gh-app-token.exe release/gh-app-token-windows.exe
          ls -lh release/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ "$PREV_TAG" = "$GITHUB_REF_NAME" ] || [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --no-decorate)
          else
            CHANGES=$(git log --oneline --no-decorate ${PREV_TAG}..${GITHUB_REF_NAME})
          fi
          # 写入多行 output
          {
            echo "CHANGES<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## gh-app-token v${{ steps.version.outputs.VERSION }}

            ### Changes
            ${{ steps.changelog.outputs.CHANGES }}

            ### Downloads
            - **Linux**: `gh-app-token-linux`
            - **macOS**: `gh-app-token-macos`
            - **Windows**: `gh-app-token-windows.exe`

            ### Usage
            ```bash
            # Linux / macOS
            chmod +x gh-app-token-linux
            ./gh-app-token-linux

            # Windows
            gh-app-token-windows.exe
            ```
          files: |
            release/gh-app-token-linux
            release/gh-app-token-macos
            release/gh-app-token-windows.exe
          draft: false
          prerelease: false